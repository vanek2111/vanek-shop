<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа — ExoTech</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-mark">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="32" height="32" rx="6" fill="currentColor"/>
                        <path d="M10 10L22 22M22 10L10 22" stroke="#16161a" stroke-width="3" stroke-linecap="square"/>
                    </svg>
                </span>
                <span class="logo-text">EXO<em>TECH</em></span>
            </a>
            <nav>
                <a href="catalog.html">Каталог</a>
                <a href="index.html#reviews">Отзывы</a>
                <a href="index.html#features">Почему мы</a>
                <a href="index.html#contacts">Контакты</a>
            </nav>
            <div class="navbar-actions">
                <a href="login.html" class="auth-btn" id="auth-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Войти</span>
                </a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <a href="cart.html" class="cart-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count">0</span>
                </a>
                <button class="menu-toggle" id="menu-toggle" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <nav class="mobile-menu" id="mobile-menu">
        <a href="catalog.html">Каталог</a>
        <a href="index.html#reviews">Отзывы</a>
        <a href="index.html#features">Почему мы</a>
        <a href="index.html#contacts">Контакты</a>
        <a href="login.html" id="auth-btn-mobile">Войти</a>
    </nav>

    <main class="checkout-page">
        <div class="container">
            <div class="breadcrumbs">
                <a href="index.html">Главная</a>
                <span>/</span>
                <a href="cart.html">Корзина</a>
                <span>/</span>
                <span class="current">Оформление</span>
            </div>

            <h1 class="checkout-title">Оформление заказа</h1>

            <div class="checkout-layout">
                <form class="checkout-form" id="checkout-form" novalidate>
                    <section class="checkout-section">
                        <h2>Контактные данные</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="customer-name">Имя и фамилия *</label>
                                <input type="text" id="customer-name" name="customer_name" placeholder="Иван Иванов" required>
                                <span class="form-error" id="error-name"></span>
                            </div>
                        </div>
                        <div class="form-row form-row-2">
                            <div class="form-group">
                                <label for="customer-phone">Телефон *</label>
                                <input type="tel" id="customer-phone" name="customer_phone" placeholder="+7 (999) 123-45-67" required>
                                <span class="form-error" id="error-phone"></span>
                            </div>
                            <div class="form-group">
                                <label for="customer-email">Email *</label>
                                <input type="email" id="customer-email" name="customer_email" placeholder="ivan@example.com" required>
                                <span class="form-error" id="error-email"></span>
                            </div>
                        </div>
                    </section>

                    <section class="checkout-section">
                        <h2>Адрес доставки</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="customer-city">Город *</label>
                                <input type="text" id="customer-city" name="city" placeholder="Москва" required>
                                <span class="form-error" id="error-city"></span>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="customer-address">Адрес *</label>
                                <input type="text" id="customer-address" name="address" placeholder="ул. Ленина, д. 1, кв. 1" required>
                                <span class="form-error" id="error-address"></span>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="customer-comment">Комментарий к заказу</label>
                                <textarea id="customer-comment" name="comment" rows="3" placeholder="Например: позвоните перед доставкой"></textarea>
                            </div>
                        </div>
                    </section>

                    <section class="checkout-section">
                        <h2>Способ оплаты</h2>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="card" checked>
                                <span class="payment-option-content">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                        <line x1="1" y1="10" x2="23" y2="10"></line>
                                    </svg>
                                    <span>Картой онлайн</span>
                                </span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="cash">
                                <span class="payment-option-content">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                                        <circle cx="12" cy="12" r="2"></circle>
                                        <path d="M6 12h.01M18 12h.01"></path>
                                    </svg>
                                    <span>Наличными при получении</span>
                                </span>
                            </label>
                        </div>
                    </section>
                </form>

                <aside class="checkout-summary" id="checkout-summary">
                    <h2>Ваш заказ</h2>
                    <div id="checkout-items"></div>
                </aside>
            </div>
        </div>
    </main>

    <footer id="contacts">
        <div class="container footer-inner">
            <div class="footer-brand">
                <div class="logo">
                    <span class="logo-mark">
                        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="32" height="32" rx="6" fill="currentColor"/>
                            <path d="M10 10L22 22M22 10L10 22" stroke="#16161a" stroke-width="3" stroke-linecap="square"/>
                        </svg>
                    </span>
                    <span class="logo-text">EXO<em>TECH</em></span>
                </div>
                <p>Периферия для побед</p>
            </div>
            <div class="footer-links">
                <a href="catalog.html">Каталог</a>
                <a href="index.html#features">Почему мы</a>
                <a href="index.html#reviews">Отзывы</a>
                <a href="index.html#contacts">Контакты</a>
            </div>
            <div class="footer-copy">© 2026 ExoTech</div>
        </div>
    </footer>

    <script src="checkout.js"></script>
    <script src="auth.js"></script>
    <script>
        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                mobileMenu.classList.toggle('open');
            });
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('open');
                });
            });
        }
    </script>
</body>
</html>
