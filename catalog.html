<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — ExoTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/catalog.css">
<link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-mark">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                </span>
                <span class="logo-text">Exo<em>Tech</em></span>
            </a>
            <nav>
                <a href="catalog.html" class="active">Каталог</a>
                <a href="index.html#reviews">Отзывы</a>
                <a href="index.html#features">Почему мы</a>
                <a href="index.html#contacts">Контакты</a>
            </nav>
            <div class="navbar-actions">
                <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <a href="cart.html" class="cart-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="catalog-hero">
        <div class="container">
            <div class="breadcrumbs">
                <a href="index.html">Главная</a>
                <span>/</span>
                <span class="current">Каталог</span>
            </div>
            <h1>Каталог товаров</h1>
            <p id="catalog-subtitle">Все товары магазина ExoTech</p>
        </div>
    </section>

    <section class="catalog-page">
        <div class="container">
            <div class="catalog-layout">
                <aside class="filters-sidebar">
                    <div class="filter-block">
                        <h3>Поиск</h3>
                        <div class="search-box">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <input type="text" id="search-input" placeholder="Название, бренд...">
                        </div>
                    </div>

                    <div class="filter-block">
                        <h3>Категории</h3>
                        <div class="filters-categories" id="category-filters"></div>
                    </div>

                    <div class="filter-block">
                        <h3>Цена, ₽</h3>
                        <div class="price-range">
                            <input type="number" id="price-min" placeholder="От" min="0">
                            <span>—</span>
                            <input type="number" id="price-max" placeholder="До" min="0">
                        </div>
                    </div>

                    <div class="filter-block">
                        <h3>Бренд</h3>
                        <div class="filters-brands" id="brand-filters"></div>
                    </div>

                    <button class="btn-reset-filters" id="reset-filters">Сбросить фильтры</button>
                </aside>

                <div class="catalog-main">
                    <div class="catalog-toolbar">
                        <div class="catalog-count" id="catalog-count">Загрузка...</div>
                        <select id="sort-select" class="sort-select">
                            <option value="default">По умолчанию</option>
                            <option value="price-asc">Цена: по возрастанию</option>
                            <option value="price-desc">Цена: по убыванию</option>
                            <option value="name-asc">Название: А → Я</option>
                        </select>
                    </div>

                    <div class="products-grid" id="products-grid">
                        <p class="loading">Загрузка товаров…</p>
                    </div>

                    <div class="no-results" id="no-results" style="display: none;">
                        <p>Ничего не найдено</p>
                        <button id="reset-filters-2">Сбросить фильтры</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer id="contacts">
        <div class="container footer-inner">
            <div class="footer-brand">
                <div class="logo">
                    <span class="logo-mark">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                        </svg>
                    </span>
                    <span class="logo-text">Exo<em>Tech</em></span>
                </div>
                <p>Электроника нового поколения</p>
            </div>
            <div class="footer-links">
                <a href="catalog.html">Каталог</a>
                <a href="index.html#features">Почему мы</a>
                <a href="index.html#reviews">Отзывы</a>
                <a href="index.html#contacts">Контакты</a>
            </div>
            <div class="footer-copy">© 2026 ExoTech</div>
        </div>
    </footer>

    <script src="catalog.js"></script>
    <script>
        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>
</body>
</html>
