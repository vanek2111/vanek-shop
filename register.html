<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ExoTech</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-mark">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="32" height="32" rx="6" fill="currentColor"/>
                        <path d="M10 10L22 22M22 10L10 22" stroke="#16161a" stroke-width="3" stroke-linecap="square"/>
                    </svg>
                </span>
                <span class="logo-text">EXO<em>TECH</em></span>
            </a>
            <nav>
                <a href="catalog.html">Каталог</a>
                <a href="index.html#project-info">Отзывы</a>
                <a href="index.html#features">Почему ExoTech</a>
                <a href="index.html#contacts">Контакты</a>
            </nav>
            <div class="navbar-actions">
                <a href="login.html" class="auth-btn" id="auth-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Войти</span>
                </a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <a href="cart.html" class="cart-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count">0</span>
                </a>
                <button class="menu-toggle" id="menu-toggle" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <nav class="mobile-menu" id="mobile-menu">
        <a href="catalog.html">Каталог</a>
        <a href="index.html#project-info">Отзывы</a>
        <a href="index.html#features">Почему ExoTech</a>
        <a href="index.html#contacts">Контакты</a>
        <a href="login.html" id="auth-btn-mobile">Войти</a>
    </nav>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <a href="index.html" class="auth-logo">
                    <span class="logo-mark">
                        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="32" height="32" rx="6" fill="currentColor"/>
                            <path d="M10 10L22 22M22 10L10 22" stroke="#16161a" stroke-width="3" stroke-linecap="square"/>
                        </svg>
                    </span>
                    <span class="logo-text">EXO<em>TECH</em></span>
                </a>

                <h1 class="auth-title">Регистрация</h1>
                <p class="auth-subtitle">Создайте аккаунт за 30 секунд</p>

                <div class="auth-message" id="auth-message"></div>

                <form class="auth-form" id="register-form" novalidate>
                    <div class="auth-field">
                        <label for="reg-name">Имя и фамилия</label>
                        <input type="text" id="reg-name" placeholder="Иван Иванов" required autocomplete="name">
                    </div>

                    <div class="auth-field">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="your@email.com" required autocomplete="email">
                    </div>

                    <div class="auth-field">
                        <label for="reg-password">Пароль (8+ символов)</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required autocomplete="new-password">
                    </div>

                    <div class="auth-field">
                        <label for="reg-password2">Повторите пароль</label>
                        <input type="password" id="reg-password2" placeholder="••••••••" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="auth-submit" id="reg-submit">Создать аккаунт</button>
                </form>

                <div class="auth-switch">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        redirectIfLoggedIn();

        // Форма регистрации
        const regForm = document.getElementById('register-form');
        if (regForm) {
            regForm.addEventListener('submit', handleRegister);
        }

        // Тема
        const toggle = document.getElementById('theme-toggle');
        if (toggle) {
            toggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        }

        // Бургер
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                mobileMenu.classList.toggle('open');
            });
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('open');
                });
            });
        }
    </script>
</body>
</html>
