        (function() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

                        <circle cx="12" cy="12" r="4"></circle>

                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

                <a href="cart.html" class="cart-btn">

                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count">0</span>

    <nav class="mobile-menu" id="mobile-menu">
        <a href="catalog.html">Каталог</a>

    </nav>

    <main class="account-page">
        <div class="container">
            <div id="account-content">
                <p class="auth-loading">Загрузка...</p>
            </div>
        </div>
    </main>

    <footer id="contacts">
        <div class="container footer-inner">
            <div class="footer-brand">
                <div class="logo">
                    <span class="logo-mark">
                        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="32" height="32" rx="6" fill="currentColor"/>
                            <path d="M10 10L22 22M22 10L10 22" stroke="#16161a" stroke-width="3" stroke-linecap="square"/>
                        </svg>
                    </span>
                    <span class="logo-text">EXO<em>TECH</em></span>
                </div>
                <p>Периферия для побед</p>
            </div>
            <div class="footer-links">
                <a href="catalog.html">Каталог</a>
                <a href="index.html#features">Почему мы</a>
                <a href="index.html#reviews">Отзывы</a>
                <a href="index.html#contacts">Контакты</a>
            </div>
            <div class="footer-copy">© 2026 ExoTech</div>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        // ========== ЗАГРУЗКА ЛК ==========
        async function initAccount() {
            const session = await requireAuth();
            if (!session) return;

            const user = session.user;
            const userId = user.id;
            const email = user.email;

            // Загружаем профиль и заказы
            const [profileRes, ordersRes] = await Promise.all([
                db.from('profiles').select('*').eq('id', userId).single(),
                db.from('orders').select('*').eq('user_id', userId).order('created_at', { ascending: false })
            ]);

            const profile = profileRes.data || {};
            const orders = ordersRes.data || [];

            // Имя: сначала из profile, потом из metadata, потом из email
            const fullName = profile.full_name
                || user.user_metadata?.full_name
                || email.split('@')[0];

            renderAccount({ user, profile, orders, fullName, email });
            updateHeaderAuth();
        }

        // ========== ОТРИСОВКА ==========
        function renderAccount({ profile, orders, fullName, email }) {
            const container = document.getElementById('account-content');

            const ordersHtml = orders.length === 0
                ? `
                    <div class="account-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <p>У вас пока нет заказов</p>
                        <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                    </div>
                `
                : orders.map(order => {
                    const date = new Date(order.created_at).toLocaleDateString('ru-RU', {
                        day: '2-digit', month: '2-digit', year: 'numeric'
                    });
                    const itemsText = (order.items || []).map(i => `${i.name} × ${i.qty}`).join(', ');
                    const statusLabels = {
                        'new': 'Новый',
                        'processing': 'В обработке',
                        'shipped': 'Отправлен',
                        'delivered': 'Доставлен'
                    };
                    const status = statusLabels[order.status] || order.status;

                    return `
                        <div class="order-item">
                            <div class="order-item-head">
                                <div>
                                    <div class="order-item-number">Заказ №${order.id}</div>
                                    <div class="order-item-date">${date}</div>
                                </div>
                                <span class="order-item-status status-${order.status}">${status}</span>
                                <div class="order-item-total">${order.total.toLocaleString()}</div>
                            </div>
                            <div class="order-item-items">${itemsText}</div>
                        </div>
                    `;
                }).join('');

            container.innerHTML = `
                <div class="account-head">
                    <div>
                        <h1 class="account-greeting">Привет, ${fullName.split(' ')[0]}!</h1>
                        <p class="account-email">${email}</p>
                    </div>
                    <button class="account-logout" onclick="handleLogout()">Выйти</button>
                </div>

                <div class="account-layout">
                    <section class="account-section">
                        <h2>История заказов</h2>
                        <div class="orders-list">
                            ${ordersHtml}
                        </div>
                    </section>

                    <aside class="account-section">
                        <h2>Мои данные</h2>
                        <form class="profile-form" id="profile-form">
                            <div class="auth-field">
                                <label for="profile-name">Имя и фамилия</label>
                                <input type="text" id="profile-name" value="${profile.full_name || fullName}" placeholder="Иван Иванов">
                            </div>
                            <div class="auth-field">
                                <label for="profile-phone">Телефон</label>
                                <input type="tel" id="profile-phone" value="${profile.phone || ''}" placeholder="+7 (999) 123-45-67">
                            </div>
                            <div class="auth-field">
                                <label for="profile-city">Город</label>
                                <input type="text" id="profile-city" value="${profile.city || ''}" placeholder="Москва">
                            </div>
                            <div class="auth-field">
                                <label for="profile-address">Адрес</label>
                                <input type="text" id="profile-address" value="${profile.address || ''}" placeholder="ул. Ленина, д. 1">
                            </div>
                            <div class="auth-message" id="profile-message"></div>
                            <button type="submit" class="auth-submit" id="profile-submit">Сохранить</button>
                        </form>
                    </aside>
                </div>
            `;

            document.getElementById('profile-form').addEventListener('submit', saveProfile);
        }

        // ========== СОХРАНЕНИЕ ПРОФИЛЯ ==========
        async function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('profile-submit');
            const msg = document.getElementById('profile-message');

            const fullName = document.getElementById('profile-name').value.trim();
            const phone = document.getElementById('profile-phone').value.trim();
            const city = document.getElementById('profile-city').value.trim();
            const address = document.getElementById('profile-address').value.trim();

            btn.disabled = true;
            btn.textContent = 'Сохранение...';

            const { data: { session } } = await db.auth.getSession();

            const { error } = await db.from('profiles').upsert({
                id: session.user.id,
                full_name: fullName,
                phone: phone,
                city: city,
                address: address
            });

            btn.disabled = false;
            btn.textContent = 'Сохранить';

            if (error) {
                msg.textContent = 'Ошибка сохранения';
                msg.className = 'auth-message error';
                return;
            }

            // Обновляем заголовок сразу после сохранения
            const greeting = document.querySelector('.account-greeting');
            if (greeting && fullName) {
                greeting.textContent = `Привет, ${fullName.split(' ')[0]}!`;
            }

            // Обновляем кнопку в шапке
            await updateHeaderAuth();

            msg.textContent = '✓ Сохранено';
            msg.className = 'auth-message success';
            setTimeout(() => {
                msg.className = 'auth-message';
            }, 2000);
        }

        // ========== ТЕМА ==========
        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        // ========== БУРГЕР ==========
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                mobileMenu.classList.toggle('open');
            });
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('open');
                });
            });
        }

        // ========== СТАРТ ==========
        initAccount();
    </script>
</body>
</html>
